<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="60%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141126"/>
      <stop offset="100%" stop-color="#090812"/>
    </linearGradient>
    <radialGradient id="auroraPurple" cx="38%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraPink" cx="68%" cy="62%" r="44%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="neonBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="underGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="55%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <clipPath id="vaultClip">
      <circle cx="256" cy="256" r="218"/>
    </clipPath>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#EC4899" flood-opacity="0.65"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#bezelGrad)"/>
  <circle cx="256" cy="256" r="218" fill="url(#vaultGrad)" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>

  <g clip-path="url(#vaultClip)">
    <rect x="38" y="38" width="436" height="436" fill="url(#auroraPurple)"/>
    <rect x="38" y="38" width="436" height="436" fill="url(#auroraPink)"/>
  </g>

  <!-- Custom Geometric L + E Vector Monogram -->
  <g filter="url(#dropShadow)">
    <!-- Geometric L with top-left bevel and angled foot -->
    <path d="M 128 166 L 144 150 L 168 150 Q 174 150 174 156 L 174 296 L 242 296 L 232 338 L 134 338 Q 128 338 128 332 Z" fill="url(#letterGrad)"/>
    <!-- Geometric E Outer Frame (Spine + Top & Bottom Bars) -->
    <path d="M 262 156 Q 262 150 268 150 L 371 150 L 382 161 L 382 190 L 308 190 L 308 298 L 382 298 L 382 327 L 371 338 L 268 338 Q 262 338 262 332 Z" fill="url(#letterGrad)"/>
  </g>

  <!-- Signature Neon Middle Energy Bar of E -->
  <rect x="318" y="227" width="70" height="34" rx="17" fill="url(#neonBarGrad)" filter="url(#neonGlow)"/>

  <!-- 4-Point Studio Spark (✦) -->
  <path d="M 204 150 L 208.6 167.4 L 226 172 L 208.6 176.6 L 204 194 L 199.4 176.6 L 182 172 L 199.4 167.4 Z" fill="#06B6D4"/>

  <!-- Bottom Telemetry / Arcade Gradient Bar -->
  <rect x="161" y="360" width="190" height="8" rx="4" fill="url(#underGrad)"/>
</svg>